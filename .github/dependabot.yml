version: 2
updates:
  # Python dependencies. Use the native "uv" ecosystem (GA since 2025-03) so Dependabot updates
  # BOTH pyproject.toml and uv.lock in sync; the "pip" ecosystem leaves uv.lock stale.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      fastapi:
        patterns: ["fastapi*", "starlette*", "uvicorn*", "sse-starlette*"]
      sqlalchemy:
        patterns: ["sqlalchemy*", "advanced-alchemy*", "psycopg*"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
