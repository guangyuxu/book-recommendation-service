# Build and run the BFF locally with docker compose.
#
# The BFF holds no database — it verifies accounts-issued tokens and proxies chat. Config comes
# from .env (copy .env.example -> .env first). Point AGENT_URL at the LangGraph agent and
# ACCOUNTS_URL at the accounts service (both run separately), and provide the accounts service's
# public key via JWT_PUBLIC_KEY / JWT_PUBLIC_KEY_PATH.
#
# Usage:
#   cp .env.example .env
#   docker compose up --build          # build and start, open http://localhost:8000/docs
#   docker compose logs -f service     # follow logs
#   docker compose down                # stop

services:
  service:
    build:
      context: .
      dockerfile: Dockerfile
    image: book-recommendation-service:0.0.1
    container_name: book-recommendation-service
    ports:
      - "8000:8000"          # API + Swagger UI at http://localhost:8000/docs
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').getcode()==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
